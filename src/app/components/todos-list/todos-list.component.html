<p style="color: black; font-size: larger; font-weight:bolder;">КОМПОНЕНТ СПИСКА ЗАДАЧ</p>
<create-todo-form (createTodo)="createTodo($event)"></create-todo-form>
<div class="todos-box">
  @for (todo of todosService.todos$ | async; track todo) {
    <div>
      <app-todo-card [todo]="todo" (deleteTodo)="deleteTodo($event)"></app-todo-card>
    </div>
  }
</div>
