<div class="todos">
    <p>Текст задачи</p>
    <div>
        {{ todo.title }}
    </div>

    <p>Автор задачи</p>
    <div>{{ todo.user }}</div>

    <p>Задача завершена</p>
    <div>{{ todo.completed ? 'Да' : 'Нет' }}</div>
    <button (click)=onDeleteTodo(todo.id) class="deleteButton">Удалить задачу</button>
</div>
