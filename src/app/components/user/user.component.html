<!--Cписок пользователей-->
<span class="heading_users">Список пользователей</span>

<div class="users_containter">
    <div *ngFor="let user of users" class="users">
        <p>{{ user.name }}</p>
        <p>{{ user.email }}</p>
        <p>{{ user.website }}</p>
        <p>{{ user.company.name }}</p>
        <button (click)="deleteUser(user.id)" class="deleteButton">
        Удалить пользователя
        </button>
    </div>
</div>
