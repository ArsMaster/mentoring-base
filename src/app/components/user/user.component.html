<!--Cписок пользователей-->
<span class="heading_users">Список пользователей</span>

<div class="users_containter">
<div *ngFor="let item of users" class="users">
    <p>{{$any(item).name}}</p>
    <p>{{$any(item).email}}</p>
    <p>{{$any(item).website}}</p>
    <p>{{$any(item).company.name}}</p>
    <button (click)="deleteUser(item.id)" class="deleteButton">Удалить пользователя</button>
</div>
</div>
